name: CICD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ] # Triggers whenever you open a PR against main
  workflow_dispatch: # Allows you to manually click "Run workflow" in GitHub Actions UI

jobs:
  Compile:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and run tests
      run: mvn -B clean verify --file pom.xml
