name: CICD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  Compile:
 
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and run tests
      run: mvn -B clean verify --file pom.xml

    - name: Update dependency graph (Dependabot)
      uses: advanced-security/maven-dependency-submission-action@v4 # Updated to a cleaner version tag
